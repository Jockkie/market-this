name: The skill made a mistake
description: The skill invented something, skipped a step, gave wrong numbers or advice that does not fit.
title: "[mistake] <short description>"
labels: ["mistake", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you. Reports like this are how the skills get better.
        **Remove names, contact details and other personal or customer data before you paste anything.**
  - type: dropdown
    id: kind
    attributes:
      label: What went wrong?
      multiple: true
      options:
        - It stated something I never told it (invented a fact or number)
        - It skipped the interview or a check
        - It asked several questions at once
        - A calculation or score was wrong
        - It said it saved a file that does not exist
        - It gave advice that is unsafe, dishonest or against the rules of my sector
        - Something else
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Where did you use it?
      options:
        - Claude Code
        - Claude.ai
        - ChatGPT
        - Hermes
        - OpenClaw
        - Grok
        - GitHub Copilot
        - Codex, Cursor or another client
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Which model, if you know it?
      placeholder: e.g. Claude Sonnet, GPT, Grok
  - type: textarea
    id: what
    attributes:
      label: What did it say, and what was wrong about it?
      description: Paste the relevant part of the conversation (anonymised). Point to the exact sentence.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should it have done?
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: I removed names, contact details and other personal data.
          required: true
