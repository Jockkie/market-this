name: Tests

on:
  push:
  pull_request:

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON files
        run: |
          find . -name "*.json" -not -path "./.git/*" -print0 | xargs -0 -n1 python -m json.tool > /dev/null
      - name: Check the upload zip is up to date
        run: python tools/build_zip.py --check
      - name: Check the skill
        run: python tests/check_skills.py
      - name: Run script tests
        run: python -m unittest discover -s tests -v
